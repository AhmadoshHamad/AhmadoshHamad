# Keeps the work profile (Ahmadosh-Hamad/Ahmadosh-Hamad) in sync with this repo.
# This repo is the source of truth: edit README.md here, never in the work repo.
# Needs secret WORK_PROFILE_DEPLOY_KEY: a private SSH key whose public half is a
# write-enabled deploy key on Ahmadosh-Hamad/Ahmadosh-Hamad.
name: Sync work profile

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/snake.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency: sync-work-profile

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: personal

      - uses: actions/checkout@v7
        with:
          repository: Ahmadosh-Hamad/Ahmadosh-Hamad
          ssh-key: ${{ secrets.WORK_PROFILE_DEPLOY_KEY }}
          path: work

      - name: Copy README and snake workflow
        run: |
          python3 - <<'PY'
          import pathlib, re, shutil
          src = pathlib.Path("personal/README.md").read_text()
          # Only the per-account block (the contribution snake) points at the work account.
          out = re.sub(
              r"<!-- per-account:start.*?<!-- per-account:end -->",
              lambda m: m.group(0).replace("AhmadoshHamad/AhmadoshHamad", "Ahmadosh-Hamad/Ahmadosh-Hamad"),
              src,
              flags=re.S,
          )
          note = "<!-- Synced from AhmadoshHamad/AhmadoshHamad. Edit it there; changes here are overwritten. -->\n"
          pathlib.Path("work/README.md").write_text(note + out)
          wf = pathlib.Path("work/.github/workflows")
          wf.mkdir(parents=True, exist_ok=True)
          shutil.copy("personal/.github/workflows/snake.yml", wf / "snake.yml")
          PY

      - name: Commit and push
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Already in sync" && exit 0
          git commit -m "Sync profile from AhmadoshHamad/AhmadoshHamad@${GITHUB_SHA::7}"
          git push
